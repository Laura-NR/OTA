name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow's gate (release.yml).
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      # The API's shutdown test renders a real PDF, so it needs the Chromium
      # headless shell that matches packages/documents' playwright.
      - name: Install the PDF browser
        run: pnpm --filter @ota/documents exec playwright install --with-deps --only-shell chromium

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
