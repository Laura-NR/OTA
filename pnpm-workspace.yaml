packages:
  - 'apps/*'
  - 'packages/*'

# pnpm 10+ blocks lifecycle scripts by default. These packages need them to
# install/build native binaries.
allowBuilds:
  '@parcel/watcher': false
  '@prisma/client': true
  '@prisma/engines': true
  '@swc/core': true
  better-sqlite3: false
  esbuild: true
  msgpackr-extract: true
  prisma: true
  workerd: true

# next 15 pins postcss to exactly 8.4.31, which carries the 2026 postcss
# advisories; the patched 8.5 line is the same major.
overrides:
  'next>postcss': ^8.5.32
