packages:
  - 'apps/*'
  - 'packages/*'

# pnpm 10+ blocks lifecycle scripts by default. These packages need them to
# install/build native binaries.
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@swc/core': true
  better-sqlite3: false
  esbuild: true
  msgpackr-extract: true
  prisma: true
  workerd: true
