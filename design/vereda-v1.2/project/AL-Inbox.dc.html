<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..700&amp;family=Inter:wght@400..700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#FBF8F3;color:#1F1B17;font-family:Inter,system-ui,sans-serif;font-size:16px;line-height:24px;-webkit-font-smoothing:antialiased}
a{color:#0B4F6C}
.ov{font:700 12px/16px Inter,system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#0B4F6C;margin:0}
.disp{font-family:Fraunces,Georgia,serif;font-weight:600;letter-spacing:-.01em;margin:0}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
.cap{font:500 12px/16px Inter,system-ui,sans-serif;color:#6E665E;margin:0}
.p{margin:0;font-size:15px;line-height:22px;color:#4A433D}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 14px;border-radius:10px;font:600 14px/20px Inter,system-ui,sans-serif;cursor:pointer;border:1px solid transparent;white-space:nowrap;text-decoration:none;box-sizing:border-box}
.btn-p{background:#0B4F6C;color:#fff}
.btn-s{background:#fff;color:#083B50;border-color:#D6CEC3}
.btn-t{background:transparent;color:#0B4F6C;padding:0 10px}
.btn:focus-visible,.bn a:focus-visible,.th:focus-visible,.chip:focus-visible,.inp:focus-visible{outline:2px solid #0B4F6C;outline-offset:2px}
.ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.card{background:#fff;border:1px solid #E8E2D9;border-radius:14px}
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:9999px;font:600 12px/16px Inter,system-ui,sans-serif;white-space:nowrap}
.tag{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:4px;background:#F3EEE6;color:#4A433D;font:500 12px/16px Inter,system-ui,sans-serif;white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:9999px;border:1px solid #D6CEC3;background:#fff;color:#1F1B17;font:500 13px/18px Inter,system-ui,sans-serif;cursor:pointer;white-space:nowrap}
.chip.on{background:#0B4F6C;color:#fff;border-color:#0B4F6C}
.th{width:100%;text-align:left;border:0;border-top:1px solid #E8E2D9;background:transparent;padding:12px 14px;font:inherit;color:inherit;cursor:pointer;display:flex;gap:12px;align-items:flex-start}
.th:first-child{border-top:0}
.av{width:40px;height:40px;border-radius:9999px;display:inline-flex;align-items:center;justify-content:center;font:700 13px/16px Inter,system-ui,sans-serif;flex:none}
.msg{display:flex;flex-direction:column;gap:2px;max-width:84%;padding:8px 12px;border-radius:12px;font-size:14px;line-height:20px}
.msg .m{font-size:11px;line-height:14px;color:#6E665E}
.inp{height:44px;padding:0 12px;border:1px solid #D6CEC3;border-radius:10px;font:400 15px/22px Inter,system-ui,sans-serif;color:#1F1B17;background:#fff;box-sizing:border-box;width:100%}
.top{display:flex;align-items:center;gap:10px;padding:12px 20px;background:#083B50;color:#fff}
.tel{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 10px;border-radius:8px;border:1px solid #D6CEC3;background:#fff;color:#083B50;text-decoration:none;font:600 12px/16px Inter,system-ui,sans-serif;white-space:nowrap}
.bn{display:flex;border-top:1px solid #E8E2D9;background:#fff;height:64px;padding-bottom:4px}
.bn a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;color:#6E665E;font:500 11px/14px Inter,system-ui,sans-serif;position:relative}
.bn a.on{color:#083B50;font-weight:700}
.bn .dot{position:absolute;top:8px;left:calc(50% + 6px);min-width:16px;height:16px;border-radius:9999px;background:#C62828;color:#fff;font:700 10px/16px Inter,system-ui,sans-serif;text-align:center;padding:0 4px;box-sizing:border-box}
</style>
</helmet>

<div style="width: 390px; min-height: 844px; position: relative; display: flex; flex-direction: column; box-sizing: border-box; background: #FBF8F3">

  <header class="top">
    <svg width="24" height="24" viewBox="0 0 32 32" aria-hidden="true"><g transform="translate(-0.8 0) scale(1)"><path d="M12.2 26.09H9.8Q8.87 26.09 8.22 25.53Q7.56 24.98 7.08 23.81L1.94 11.01Q1.58 10.15 1.41 9.84Q1.23 9.53 0.89 9.28L0.46 9.02Q-0 8.63 -0.16 8.33Q-0.32 8.03 -0.32 7.55Q-0.32 6.82 0.12 6.41Q0.56 6 1.3 6H10.45Q11.95 6 11.95 7.55Q11.95 8.12 11.67 8.44Q11.39 8.75 10.87 9.08L10.4 9.32Q9.87 9.6 9.75 10.19Q9.63 10.78 9.97 11.74L14.08 22.79L12.21 23.16L16.4 11.71Q16.7 10.87 16.54 10.27Q16.39 9.67 15.72 9.3L15.22 9.08Q14.69 8.76 14.47 8.44Q14.26 8.13 14.26 7.55Q14.26 6.82 14.69 6.41Q15.12 6 15.88 6H20.86Q21.61 6 22.06 6.41Q22.5 6.82 22.5 7.55Q22.5 8.03 22.33 8.36Q22.15 8.68 21.7 9L21.27 9.26Q20.9 9.53 20.62 10Q20.35 10.46 19.76 11.96L14.95 24.02Q14.47 25.21 13.76 25.65Q13.05 26.09 12.2 26.09Z" fill="#A83E24"/><path d="M27.8 26.58Q26.57 26.58 25.6 25.97Q24.62 25.36 24.06 24.36Q23.5 23.36 23.5 22.15Q23.5 20.92 24.06 19.94Q24.62 18.95 25.6 18.36Q26.57 17.78 27.8 17.78Q29.06 17.78 30.03 18.36Q31.01 18.95 31.57 19.93Q32.12 20.92 32.12 22.15Q32.12 23.36 31.57 24.36Q31.01 25.36 30.04 25.97Q29.07 26.58 27.8 26.58Z" fill="#F2B134"/></g></svg>
    <div style="display: flex; flex-direction: column; flex: 1; min-width: 0"><strong style="font-size: 16px; line-height: 20px">Ops Lite · Inbox</strong><span style="font-size: 12px; line-height: 16px; color: #C9DDE6">travelers and workers in one list · replies logged as Ana R. (mobile)</span></div>
  </header>

  <main style="display: flex; flex-direction: column; gap: 12px; padding: 14px 20px 24px; flex: 1">
    <div style="display: flex; gap: 6px; flex-wrap: wrap">
      <sc-for list="{{filters}}" as="f" hint-placeholder-count="4"><button class="chip {{f.cls}}" type="button" aria-pressed="{{f.on}}" onClick="{{f.pick}}">{{f.label}} <span class="mono" style="font-size: 12px; opacity: .85">{{f.n}}</span></button></sc-for>
    </div>

    <!-- Threads -->
    <div class="card" style="display: flex; flex-direction: column">
      <sc-for list="{{threads}}" as="t" hint-placeholder-count="6">
        <button class="th" type="button" aria-pressed="{{t.on}}" onClick="{{t.pick}}" style="background: {{t.bg}}">
          <span class="av" style="background: {{t.abg}}; color: {{t.afg}}">{{t.init}}</span>
          <span style="display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0">
            <span style="display: flex; gap: 8px; align-items: center"><strong style="font-size: 15px; line-height: 20px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{t.name}}</strong><span class="cap">{{t.when}}</span></span>
            <span style="font-size: 14px; line-height: 20px; color: #4A433D; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{t.last}}</span>
            <span style="display: flex; gap: 6px; flex-wrap: wrap"><span class="tag">{{t.kind}}</span><sc-if value="{{t.urgent}}" hint-placeholder-val="{{ false }}"><span class="pill" style="background: #FDECEA; color: #B71C1C">Urgent</span></sc-if><sc-if value="{{t.unread}}" hint-placeholder-val="{{ false }}"><span class="pill" style="background: #E3F2FD; color: #0D47A1">New</span></sc-if></span>
          </span>
        </button>
      </sc-for>
    </div>

    <!-- Open thread -->
    <div class="card" style="display: flex; flex-direction: column; gap: 10px; padding: 14px">
      <div style="display: flex; gap: 10px; align-items: center"><span class="av" style="background: {{th.abg}}; color: {{th.afg}}">{{th.init}}</span><span style="display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0"><strong style="font-size: 16px; line-height: 20px">{{th.name}}</strong><span class="cap">{{th.sub}}</span></span><a class="tel" href="{{th.tel}}" aria-label="Call {{th.name}}"><svg class="ic" style="width: 14px; height: 14px" viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.6a2 2 0 0 1-.5 2.1L8.1 9.7a16 16 0 0 0 6 6l1.3-1.2a2 2 0 0 1 2.1-.5c.8.3 1.7.6 2.6.7a2 2 0 0 1 1.9 2Z"/></svg>Call</a></div>
      <sc-if value="{{th.isWorker}}" hint-placeholder-val="{{ false }}">
        <div style="display: flex; gap: 8px; align-items: center"><button class="chip {{trCls}}" type="button" aria-pressed="{{tr}}" onClick="{{toggleTr}}"><svg class="ic" style="width: 14px; height: 14px" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>{{trLabel}}</button><span class="cap">Worker threads are in Spanish; your reply is sent in Spanish.</span></div>
      </sc-if>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <sc-for list="{{th.msgs}}" as="m" hint-placeholder-count="3">
          <div class="msg" style="background: {{m.bg}}; align-self: {{m.side}}"><span>{{m.text}}</span><span class="m">{{m.meta}}</span></div>
        </sc-for>
      </div>
      <div style="display: flex; gap: 6px; flex-wrap: wrap"><sc-for list="{{th.quick}}" as="q" hint-placeholder-count="3"><button class="chip" type="button">{{q}}</button></sc-for></div>
      <div style="display: flex; gap: 8px"><input class="inp" type="text" placeholder="{{th.ph}}" aria-label="Reply"><button class="btn btn-p" type="button" style="padding: 0 14px" aria-label="Send"><svg class="ic" viewBox="0 0 24 24"><path d="m22 2-7 20-4-9-9-4Z"/></svg></button></div>
      <span class="cap">{{th.note}}</span>
    </div>
    <div style="height: 72px"></div>
  </main>

  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 844px; border-top: 1px dashed #A83E24; pointer-events: none"><span style="position: absolute; right: 8px; top: 2px; font: 500 10px/14px Inter, system-ui, sans-serif; color: #A83E24">first viewport · 844</span></div>
  <nav class="bn" aria-label="Main" style="position: absolute; left: 0; right: 0; top: 780px; box-shadow: 0 -4px 12px rgba(31,27,23,.06)">
    <a href="AL-Alerts.dc.html"><svg class="ic" viewBox="0 0 24 24"><path d="m10.3 3.9-8.5 14.2a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4M12 17h.01"/></svg>Alerts<span class="dot">2</span></a>
    <a href="AL-Pipeline.dc.html"><svg class="ic" viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h7"/></svg>Pipeline</a>
    <a href="AL-Inbox.dc.html" class="on" aria-current="page"><svg class="ic" viewBox="0 0 24 24"><path d="M4 4h16v12H7l-3 3V4Z"/></svg>Inbox<span class="dot">3</span></a>
    <a href="A-Dashboard.dc.html"><svg class="ic" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="14" rx="2"/><path d="M8 21h8M12 18v3"/></svg>Desk</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1560}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { filter: 'all', sel: 'holm', tr: true };
  }
  renderVals() {
    const s = this.state;
    const IN = { bg: '#F3EEE6', side: 'flex-start' }, OUT = { bg: '#E6F0F4', side: 'flex-end' };
    const T = {
      holm: { name: 'Anders Holm', init: 'AH', abg: '#E3F2FD', afg: '#0D47A1', kind: 'Traveler · on trip · Viñales', urgent: true, unread: true, when: '14:10', last: 'Is the generator on tonight? Birgit needs her CPAP.', sub: 'VX-6RQ4JD · Casa Yamilé · DC-0931 · EN', tel: 'tel:+4520555102', isWorker: false, ph: 'Reply to Anders · in-app + email + SMS',
        msgs: [{ ...IN, text: 'Is the generator on tonight? Birgit needs her CPAP machine for sleeping.', meta: 'Anders · 14:10 · in-app' }, { ...OUT, text: 'Yes: Yamilé runs it 18:00–21:00 and we are adding a battery pack for the night, delivered by 17:00. If you prefer, Villa Los Pinos (solar, all night) has a room for you tonight at no cost. Tell me which.', meta: 'Ana (mobile) · 14:12 · sent in-app + email + SMS' }, { ...IN, text: 'Battery pack would be perfect, thank you!', meta: 'Anders · 14:16' }],
        quick: ['Battery pack confirmed for 17:00', 'Relocation offered', 'Call me when convenient'], note: 'Urgent because a disruption case is open on this booking. Reply time target: 15 min.' },
      reinier: { name: 'Reinier Soto', init: 'RS', abg: '#FEF3C7', afg: '#92400E', kind: 'Worker · driver', urgent: false, unread: false, when: '13:52', last: 'Listo, salgo a las 15:30. Combustible ok.', sub: 'SUP-0098 · today 15:50 HAV → Vedado · offer VX-7K2M9Q at 76 %', tel: 'tel:+5352413388', isWorker: true, ph: 'Escribe a Reinier · worker app',
        msgs: [{ ...OUT, text: 'Vuelo IB 6621 a tiempo. ¿Cartel listo? Ingrid lleva bastón, ayúdala con las maletas.', meta: 'Ana · 13:40' }, { ...IN, text: s.tr ? 'Ready, leaving at 15:30. Fuel ok. (translated from Spanish)' : 'Listo, salgo a las 15:30. Combustible ok.', meta: 'Reinier · 13:52 · worker app' }, { ...OUT, text: s.tr ? 'And the Viñales offer for 13 Feb? You have 29 minutes left, otherwise it goes to Lázaro. (sent in Spanish)' : '¿Y la oferta de Viñales del 13 feb? Te quedan 29 minutos, si no pasa a Lázaro.', meta: 'Ana (mobile) · 14:31' }],
        quick: ['¿Puedes aceptar la oferta?', 'Llámame', 'Gracias'], note: 'Workers see only first names and local numbers. Nothing about billing is ever in this thread.' },
      chen: { name: 'Margaret Chen', init: 'MC', abg: '#E3F2FD', afg: '#0D47A1', kind: 'Traveler · confirming', urgent: false, unread: false, when: '13:31', last: 'Perfect, thank you!', sub: 'VX-7K2M9Q · Viñales 13–20 Feb · EN · CA', tel: 'tel:+16045550142', isWorker: false, ph: 'Reply to Margaret · in-app + email',
        msgs: [{ ...IN, text: 'We\'d love the horseback morning instead of the Las Terrazas day trip. Is the casa ok with a late arrival around 17:30?', meta: 'Margaret · 13:14 · web' }, { ...OUT, text: 'Done: horseback is in, Yamilé confirmed and will have dinner ready at 17:30. Driver confirming now; I\'ll write again within the hour.', meta: 'Ana · 13:26' }, { ...IN, text: 'Perfect, thank you!', meta: 'Margaret · 13:31 · email reply' }],
        quick: ['Still confirming your driver', 'All four pieces confirmed', 'Invoice on its way'], note: 'In-app is the record; email copies go out automatically.' },
      osvaldo: { name: 'Osvaldo Ruiz', init: 'OR', abg: '#FDECEA', afg: '#B71C1C', kind: 'Worker · guide · timed out', urgent: true, unread: false, when: '12:40', last: 'SMS fallback sent · no reply', sub: 'SUP-0061 · VX-3PA8ZT · red since 13:40', tel: 'tel:+5358827740', isWorker: true, ph: 'Escribe a Osvaldo',
        msgs: [{ ...OUT, text: s.tr ? 'Offer: Zapata birding 2–5 March, Klaus +1, € 160. Please answer in the app. (sent in Spanish)' : 'Oferta: aves en Zapata 2–5 de marzo, Klaus +1, € 160. Responde en la app, por favor.', meta: 'System · 11:40 · push' }, { ...OUT, text: s.tr ? 'Osvaldo, are you there? The offer expires at 13:40. (sent in Spanish)' : 'Osvaldo, ¿estás? La oferta caduca a las 13:40.', meta: 'System · 12:40 · SMS fallback' }, { ...IN, text: '—', meta: 'no reply · phone off or no signal' }],
        quick: ['¿Todo bien? Llámame', 'Reasignado a otro guía'], note: 'Three timeouts in a month trigger a reliability review; one more and he leaves auto-dispatch.' },
      ortega: { name: 'Luis Ortega', init: 'LO', abg: '#E3F2FD', afg: '#0D47A1', kind: 'Traveler · OFAC missing', urgent: false, unread: true, when: '12:40', last: 'Opened WhatsApp click-to-chat from the reminder', sub: 'VX-2F9HQ3 · family visit · arrival in 44 h · ES', tel: 'tel:+13055550188', isWorker: false, ph: 'Escribe a Luis · in-app + email + SMS',
        msgs: [{ ...OUT, text: 'Recordatorio: firma la certificación OFAC para recibir tus vouchers. Tarda 2 minutos.', meta: 'System · 09:00 · email + SMS' }, { ...IN, text: '(opened the WhatsApp link · not a logged message)', meta: '12:40' }],
        quick: ['¿Te ayudo con la certificación?', 'Llámame cuando puedas', 'Vouchers listos al firmar'], note: 'Documents are on hold until the affidavit is on file. WhatsApp is not stored: log the call if you speak.' },
      yamile: { name: 'Yamilé Torres', init: 'YT', abg: '#FEF3C7', afg: '#92400E', kind: 'Worker · host · Casa Yamilé', urgent: false, unread: false, when: '09:40', last: 'Generador ok, combustible para 2 días.', sub: 'SUP-0017 · Viñales · 2 travelers in house · DC-0931', tel: 'tel:+5352290174', isWorker: true, ph: 'Escribe a Yamilé',
        msgs: [{ ...OUT, text: s.tr ? 'Good morning Yamilé, how is the house? The Holms are fine? (sent in Spanish)' : 'Buenos días Yamilé, ¿cómo está la casa? ¿Los Holm bien?', meta: 'Ana · 09:35' }, { ...IN, text: s.tr ? 'Generator ok, fuel for 2 days. They slept fine, charging phones now. (translated)' : 'Generador ok, combustible para 2 días. Durmieron bien, cargando teléfonos ahora.', meta: 'Yamilé · 09:40' }],
        quick: ['Te llevamos una batería a las 17:00', 'Gracias, avísame si cambia'], note: 'Host messages also feed the disruption case log.' }
    };
    const order = ['holm', 'osvaldo', 'reinier', 'ortega', 'chen', 'yamile'];
    const kindOf = (k) => (T[k].isWorker ? 'workers' : 'travelers');
    const visible = order.filter((k) => s.filter === 'all' || (s.filter === 'urgent' ? T[k].urgent : kindOf(k) === s.filter));
    const threads = visible.map((k) => { const t = T[k]; const on = s.sel === k; return { ...t, on, bg: on ? '#E6F0F4' : 'transparent', pick: () => this.setState({ sel: k }) }; });
    const counts = { all: 6, urgent: 2, travelers: 3, workers: 3 };
    const filters = [['all', 'All'], ['urgent', 'Urgent'], ['travelers', 'Travelers'], ['workers', 'Workers']].map(([k, label]) => ({ key: k, label, n: counts[k], on: s.filter === k, cls: s.filter === k ? 'on' : '', pick: () => this.setState({ filter: k }) }));
    return { filters, threads, th: T[s.sel], tr: s.tr, trCls: s.tr ? 'on' : '', trLabel: s.tr ? 'Translating to English' : 'Show original Spanish', toggleTr: () => this.setState({ tr: !s.tr }) };
  }
}
</script>
